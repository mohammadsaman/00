  <style>
    :root{
      --bg:#07080b;
      --card:rgba(18,19,26,.72);
      --wine:#c0304a;
      --wine2:#7a1b2d;
      --silver:#e9edf5;
      --muted:#8a90a3;
      --line:rgba(255,255,255,.08);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth}
    body{
      font-family:'DM Sans',system-ui,sans-serif;
      background:var(--bg);
      color:var(--silver);
      min-height:100vh;
      display:flex;justify-content:center;align-items:center;
      padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
      overflow-x:hidden;
    }

    /* animated aurora background */
    .aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
    .aurora i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.28;animation:float 18s ease-in-out infinite}
    .aurora i:nth-child(1){width:520px;height:520px;background:var(--wine2);top:-160px;left:-160px}
    .aurora i:nth-child(2){width:460px;height:460px;background:#3a4a7a;bottom:-140px;right:-120px;animation-delay:-6s}
    .aurora i:nth-child(3){width:320px;height:320px;background:var(--wine);top:45%;left:55%;opacity:.14;animation-delay:-11s}
    @keyframes float{50%{transform:translate(40px,-50px) scale(1.12)}}
    #bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

    /* main card */
    .card{
      position:relative;z-index:1;width:100%;max-width:430px;
      background:var(--card);
      backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
      border:1px solid var(--line);
      border-radius:32px;
      padding:14px 14px 26px;
      box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 1px rgba(192,48,74,.06);
      animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}

    /* cover art */
    .cover{
      position:relative;border-radius:22px;overflow:hidden;
      aspect-ratio:1/1;
      transform-style:preserve-3d;
      transition:transform .25s ease;
      box-shadow:0 20px 50px rgba(0,0,0,.55);
    }
    .cover img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.03)}
    .cover::after{ /* glossy shine + fade into card */
      content:'';position:absolute;inset:0;pointer-events:none;
      background:
        linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 48%,transparent 60%) no-repeat,
        linear-gradient(to top,rgba(18,19,26,.55),transparent 35%);
      background-size:250% 100%,100% 100%;
      background-position:130% 0,0 0;
      animation:shine 6s ease-in-out 1.2s infinite;
    }
    @keyframes shine{0%{background-position:130% 0,0 0}35%,100%{background-position:-60% 0,0 0}}

    .status{
      position:absolute;top:14px;left:14px;z-index:2;
      display:flex;align-items:center;gap:8px;
      padding:7px 12px;border-radius:99px;
      background:rgba(7,8,11,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      border:1px solid var(--line);
      font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    }
    .status b{width:8px;height:8px;border-radius:50%;background:#3dffb0;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(61,255,176,.6)}50%{box-shadow:0 0 0 7px rgba(61,255,176,0)}}

    /* heading */
    .head{text-align:center;padding:26px 10px 24px}
    h1{
      font-family:'Syne',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.5px;
      background:linear-gradient(120deg,#fff 30%,var(--wine) 120%);
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    }
    .sub{margin-top:8px;color:var(--muted);font-size:12px;letter-spacing:.22em;text-transform:uppercase}
    .bar{width:46px;height:3px;border-radius:3px;margin:20px auto 0;background:linear-gradient(90deg,var(--wine),var(--silver))}

    /* links */
    .links{display:flex;flex-direction:column;gap:11px;padding:0 6px}
    .links a{
      --c:var(--wine);
      position:relative;display:flex;align-items:center;gap:15px;
      padding:13px 16px;border-radius:18px;
      color:var(--silver);text-decoration:none;font-weight:500;font-size:15.5px;
      background:rgba(255,255,255,.04);border:1px solid var(--line);
      overflow:hidden;
      transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
      animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
    }
    .links a:nth-child(1){animation-delay:.25s}
    .links a:nth-child(2){animation-delay:.32s}
    .links a:nth-child(3){animation-delay:.39s}
    .links a:nth-child(4){animation-delay:.46s}
    .links a:nth-child(5){animation-delay:.53s}
    .links a::before{
      content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s;
      background:linear-gradient(100deg,color-mix(in srgb,var(--c) 28%,transparent),transparent 70%);
    }
    .links a:hover,.links a:focus-visible{
      transform:translateY(-3px) scale(1.012);
      border-color:color-mix(in srgb,var(--c) 60%,transparent);
      box-shadow:0 14px 34px color-mix(in srgb,var(--c) 28%,transparent);
      outline:none;
    }
    .links a:hover::before,.links a:focus-visible::before{opacity:1}
    .links a:active{transform:scale(.98)}
    .fb{--c:#1877f2}.ig{--c:#e1306c}.yt{--c:#ff2d2d}.tt{--c:#25f4ee}.pf{--c:#c0304a}

    .ico{
      position:relative;z-index:1;flex-shrink:0;width:42px;height:42px;border-radius:13px;
      display:grid;place-items:center;
      background:color-mix(in srgb,var(--c) 18%,transparent);
      border:1px solid color-mix(in srgb,var(--c) 30%,transparent);
      transition:transform .3s;
    }
    .ico svg{width:19px;height:19px;fill:var(--c)}
    .links a:hover .ico{transform:rotate(-8deg) scale(1.1)}
    .label{position:relative;z-index:1;flex:1}
    .arrow{position:relative;z-index:1;width:18px;height:18px;fill:var(--muted);opacity:.5;transition:transform .25s,opacity .25s,fill .25s}
    .links a:hover .arrow{transform:translateX(4px);opacity:1;fill:var(--silver)}

    .footer{margin-top:26px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.06em}
    .footer span{color:var(--wine);font-weight:700}

    @media (max-width:420px){
      h1{font-size:26px}
      .links a{font-size:15px;padding:12px 14px}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important}
    }
  </style>
</head>

  <script>
    /* ---------- particles ---------- */
    const canvas=document.getElementById('bg-canvas'),ctx=canvas.getContext('2d');
    let W,H,P=[];
    const COLS=[[192,48,74],[233,237,245],[122,27,45]];
    function init(){
      W=canvas.width=innerWidth;H=canvas.height=innerHeight;
      const n=Math.min(70,Math.floor(W*H/18000));
      P=Array.from({length:n},()=>({
        x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.4,
        c:COLS[Math.floor(Math.random()*COLS.length)],
        vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,
        a:Math.random()*.4+.15,t:Math.random()*6.28,ts:Math.random()*.01+.005
      }));
    }
    function loop(){
      ctx.clearRect(0,0,W,H);
      for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
        const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d=Math.hypot(dx,dy);
        if(d<130){ctx.strokeStyle=`rgba(192,48,74,${(1-d/130)*.14})`;ctx.lineWidth=.6;
          ctx.beginPath();ctx.moveTo(P[i].x,P[i].y);ctx.lineTo(P[j].x,P[j].y);ctx.stroke();}
      }
      for(const p of P){
        p.t+=p.ts;const o=p.a+Math.sin(p.t)*.1;
        ctx.fillStyle=`rgba(${p.c[0]},${p.c[1]},${p.c[2]},${o})`;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
        p.x+=p.vx;p.y+=p.vy;
        if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;
        if(p.y<-10)p.y=H+10;if(p.y>H+10)p.y=-10;
      }
      requestAnimationFrame(loop);
    }
    init();
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)loop();
    addEventListener('resize',init);

    /* ---------- 3D tilt on cover ---------- */
    const card=document.getElementById('card'),cover=document.getElementById('cover');
    if(matchMedia('(hover:hover)').matches){
      card.addEventListener('mousemove',e=>{
        const r=cover.getBoundingClientRect();
        const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
        cover.style.transform=`perspective(900px) rotateY(${x*10}deg) rotateX(${-y*10}deg) scale(1.02)`;
      });
      card.addEventListener('mouseleave',()=>cover.style.transform='');
    }
  </script>
